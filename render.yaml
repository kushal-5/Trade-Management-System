# Render Blueprint: https://render.com/docs/blueprint-spec
# After first deploy, set env vars in the Render dashboard (see list in your reply / team docs).
services:
  - type: web
    name: tms-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: rm -rf node_modules && npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
